<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/parent">Manage</a>
    <a href="/setup">Setup</a>
  </nav>

  <main class="task-page">
    <header class="brand-block">
      <p class="brand-mark" id="userHeader">Loading...</p>
      <p class="brand-sub">Mark tasks done as you go. Reset anytime.</p>
    </header>

    <div class="progress-wrap">
      <div class="progress-pill">Done <span id="doneCount">0</span> / <span id="totalCount">0</span></div>
    </div>

    <div id="choreList" class="task-list"></div>

    <button class="reset-btn" onclick="resetChores()">Reset Completed Tasks</button>
  </main>

<script>
  const userId = new URLSearchParams(window.location.search).get('id');
  const STORAGE_KEY = `userChores_${userId}`;

  async function fetchUserName() {
    const res = await fetch(`/api/users/${userId}`);
    const data = await res.json();
    document.getElementById("userHeader").textContent = `${data.name}'s Tasks`;
    document.title = `${data.name}'s Tasks`;
  }

  async function fetchChores() {
    const response = await fetch(`/api/chores/${userId}`);
    return await response.json();
  }

  function loadChoreStatus() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }

  function saveChoreStatus(doneIds) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(doneIds));
  }

  function renderChores(chores) {
    const choreList = document.getElementById("choreList");
    const doneIds = loadChoreStatus();
    choreList.innerHTML = "";

    if (!chores.length) {
      choreList.innerHTML = '<p class="empty-note">No active tasks.</p>';
      document.getElementById("doneCount").textContent = 0;
      document.getElementById("totalCount").textContent = 0;
      return;
    }

    chores.forEach((chore, index) => {
      const div = document.createElement("div");
      div.className = "chore" + (doneIds.includes(chore.id) ? " done" : "");
      div.style.animationDelay = `${0.05 + index * 0.04}s`;
      const days = chore.days_required ? ` · ${chore.days_required}` : '';

      div.innerHTML = `
        <span>${chore.title}${days}</span>
        <button ${doneIds.includes(chore.id) ? "disabled" : ""}>Mark Done</button>
      `;

      const button = div.querySelector("button");
      button.addEventListener("click", () => {
        doneIds.push(chore.id);
        saveChoreStatus(doneIds);
        updateDisplay();
      });

      choreList.appendChild(div);
    });

    const completed = chores.filter(c => doneIds.includes(c.id)).length;
    document.getElementById("doneCount").textContent = completed;
    document.getElementById("totalCount").textContent = chores.length;
  }

  function resetChores() {
    localStorage.removeItem(STORAGE_KEY);
    updateDisplay();
  }

  async function updateDisplay() {
    const chores = await fetchChores();
    renderChores(chores);
  }

  fetchUserName();
  updateDisplay();
</script>
</body>
</html>
