<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/tasks.js"></script>
</head>
<body>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/parent">Manage</a>
    <a href="/setup">Setup</a>
  </nav>

  <main class="task-page">
    <header class="brand-block">
      <p class="brand-mark" id="userHeader">Loading...</p>
      <p class="brand-sub">Check off what you finish. Daily tasks reopen tomorrow; reset the week when you start fresh.</p>
    </header>

    <div class="progress-wrap">
      <div class="progress-pill">Done <span id="doneCount">0</span> / <span id="totalCount">0</span></div>
    </div>

    <div id="choreList" class="task-list"></div>

    <button class="reset-btn" id="resetWeekBtn" type="button">Reset this week</button>
  </main>

<script>
  const userId = new URLSearchParams(window.location.search).get('id');

  async function fetchUserName() {
    const res = await fetch(`/api/users/${userId}`);
    const data = await res.json();
    document.getElementById("userHeader").textContent = `${data.name}'s Tasks`;
    document.title = `${data.name}'s Tasks`;
  }

  async function fetchChores() {
    const response = await fetch(`/api/chores/${userId}`);
    return await response.json();
  }

  function renderChores(chores) {
    const choreList = document.getElementById("choreList");
    const state = HomeTasks.loadState();
    choreList.innerHTML = "";

    if (!chores.length) {
      choreList.innerHTML = '<p class="empty-note">No active tasks.</p>';
      document.getElementById("doneCount").textContent = 0;
      document.getElementById("totalCount").textContent = 0;
      return;
    }

    chores.forEach((chore, index) => {
      const done = HomeTasks.isDone(chore, state);
      const row = document.createElement("label");
      row.className = "chore task-check" + (done ? " done" : "");
      row.style.animationDelay = `${0.05 + index * 0.04}s`;
      const days = chore.days_required ? chore.days_required : "This week";
      const dailyNote = HomeTasks.isDaily(chore) ? " · resets tomorrow" : "";

      row.innerHTML = `
        <input type="checkbox" ${done ? "checked" : ""} />
        <span class="task-check-body">
          <span class="task-check-title">${chore.title}</span>
          <span class="task-check-meta">${days}${dailyNote}</span>
        </span>
      `;

      const checkbox = row.querySelector("input");
      checkbox.addEventListener("change", () => {
        const latest = HomeTasks.loadState();
        HomeTasks.setDone(chore, checkbox.checked, latest);
        updateDisplay();
      });

      choreList.appendChild(row);
    });

    const completed = chores.filter((c) => HomeTasks.isDone(c, state)).length;
    document.getElementById("doneCount").textContent = completed;
    document.getElementById("totalCount").textContent = chores.length;
  }

  document.getElementById("resetWeekBtn").addEventListener("click", () => {
    if (!confirm("Clear all checkmarks for this week (all people on this browser)?")) return;
    HomeTasks.resetWeek();
    HomeTasks.clearLegacyKeys([userId]);
    updateDisplay();
  });

  async function updateDisplay() {
    const chores = await fetchChores();
    renderChores(chores);
  }

  fetchUserName();
  updateDisplay();
</script>
</body>
</html>
