<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #eef6ff;
      color: #333;
      padding: 30px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      text-align: center;
      font-size: 2.2em;
    }
    .progress {
      text-align: center;
      font-size: 1.35em;
      margin-bottom: 30px;
    }
    .chore {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border: 2px solid #b3dafe;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      gap: 12px;
    }
    .chore.done {
      background: #d8fbd8;
      text-decoration: line-through;
      opacity: 0.7;
    }
    .chore button {
      padding: 8px 12px;
      border: none;
      background: #28a745;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chore button:disabled {
      background: #888;
      cursor: default;
    }
    .reset-btn {
      display: block;
      margin: 30px auto 0;
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: #ff6b6b;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/parent">Manage</a>
    <a href="/setup">Setup</a>
  </nav>

  <h1 id="userHeader">Loading...</h1>
  <div class="progress">Done: <span id="doneCount">0</span> / <span id="totalCount">0</span></div>

  <div id="choreList"></div>

  <button class="reset-btn" onclick="resetChores()">Reset Completed Tasks</button>

<script>
  const userId = new URLSearchParams(window.location.search).get('id');
  const STORAGE_KEY = `userChores_${userId}`;

  async function fetchUserName() {
    const res = await fetch(`/api/users/${userId}`);
    const data = await res.json();
    document.getElementById("userHeader").textContent = `${data.name}'s Tasks`;
    document.title = `${data.name}'s Tasks`;
  }

  async function fetchChores() {
    const response = await fetch(`/api/chores/${userId}`);
    return await response.json();
  }

  function loadChoreStatus() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }

  function saveChoreStatus(doneIds) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(doneIds));
  }

  function renderChores(chores) {
    const choreList = document.getElementById("choreList");
    const doneIds = loadChoreStatus();
    choreList.innerHTML = "";

    chores.forEach(chore => {
      const div = document.createElement("div");
      div.className = "chore" + (doneIds.includes(chore.id) ? " done" : "");
      const days = chore.days_required ? ` · ${chore.days_required}` : '';

      div.innerHTML = `
        <span>${chore.title}${days}</span>
        <button ${doneIds.includes(chore.id) ? "disabled" : ""}>Mark Done</button>
      `;

      const button = div.querySelector("button");
      button.addEventListener("click", () => {
        doneIds.push(chore.id);
        saveChoreStatus(doneIds);
        updateDisplay();
      });

      choreList.appendChild(div);
    });

    const completed = chores.filter(c => doneIds.includes(c.id)).length;
    document.getElementById("doneCount").textContent = completed;
    document.getElementById("totalCount").textContent = chores.length;
  }

  function resetChores() {
    localStorage.removeItem(STORAGE_KEY);
    updateDisplay();
  }

  async function updateDisplay() {
    const chores = await fetchChores();
    renderChores(chores);
  }

  fetchUserName();
  updateDisplay();
</script>
</body>
</html>
