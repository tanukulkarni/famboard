<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — TK &amp; AX Home</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/parent">Manage</a>
    <a href="/setup" class="active">Setup</a>
  </nav>

  <main class="page narrow">
    <header class="brand-block">
      <p class="brand-mark">Setup</p>
      <p class="brand-sub">Add people who have task lists. Theo care belongs on Events.</p>
    </header>

    <form id="userForm" class="form-panel">
      <label for="username">Add person
        <input type="text" id="username" required placeholder="e.g. TK">
      </label>
      <button type="submit">Add Person</button>
    </form>

    <h2 class="section-title">People</h2>
    <ul id="userList" class="people-list"></ul>
  </main>

  <script>
    async function fetchUsers() {
      const res = await fetch('/api/users');
      return await res.json();
    }

    async function displayUsers() {
      const users = await fetchUsers();
      const list = document.getElementById('userList');
      list.innerHTML = '';
      if (!users.length) {
        list.innerHTML = '<li class="empty-note">No people yet.</li>';
        return;
      }
      users.forEach(user => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${user.name}</strong> <a href="/user.html?id=${user.id}">Open tasks</a>`;
        list.appendChild(li);
      });
    }

    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('username').value.trim();
      if (!name) return;
      await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      document.getElementById('userForm').reset();
      displayUsers();
    });

    displayUsers();
  </script>
</body>
</html>
