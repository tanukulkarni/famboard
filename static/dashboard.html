<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TK &amp; AX Home</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/tasks.js"></script>
</head>
<body>
  <nav>
    <a href="/dashboard" class="active">Dashboard</a>
    <span id="peopleNav" class="people-nav"></span>
    <a href="/parent">Manage</a>
    <a href="/setup">Setup</a>
  </nav>

  <main class="page">
    <header class="brand-block">
      <p class="brand-mark">TK &amp; AX Home</p>
      <p class="brand-sub">Check off the day columns as you go. Reset the board when the week is done.</p>
      <div id="personButtons" class="person-buttons"></div>
    </header>

    <div class="dashboard">
      <section class="panel panel-wide" id="choresCard">
        <div class="panel-head">
          <h2>Household Tasks</h2>
          <button type="button" class="btn-secondary" id="resetWeekBtn">Reset week</button>
        </div>
        <p class="hint" id="weekHint"></p>
        <div id="choreOverview" class="task-board"></div>
      </section>

      <section class="panel calendar">
        <h2>Events &amp; Theo Care</h2>
        <ul id="eventsList"></ul>
      </section>

      <section class="panel">
        <h2>Meal Plan</h2>
        <ul id="mealsList"></ul>
      </section>

      <section class="panel quote" id="quoteCard">
        <h2>Quote of the Day</h2>
        <blockquote id="quoteText">Loading...</blockquote>
        <footer id="quoteAuthor"></footer>
      </section>
    </div>
  </main>

<script>
  async function fetchUsers() {
    return HomeTasks.fetchUsers();
  }

  async function fetchChoresForUser(userId) {
    const res = await fetch(`/api/chores/${userId}`);
    return await res.json();
  }

  function weekLabel(weekId) {
    return `Week ${weekId.replace('-W', ' · W')}`;
  }

  async function loadChoreOverview() {
    const container = document.getElementById('choreOverview');
    const users = await fetchUsers();
    const state = HomeTasks.loadState();
    document.getElementById('weekHint').textContent =
      `${weekLabel(state.weekId)} — M–S are days of the week. Dots mean that day doesn’t apply. Use Reset week for a clean slate.`;

    container.innerHTML = '';

    if (!users.length) {
      container.innerHTML = '<p class="empty-note">No people yet. Add TK and AX on Setup, or run seed_family.py.</p>';
      return;
    }

    for (const user of users) {
      const chores = await fetchChoresForUser(user.id);
      const group = document.createElement('div');
      group.className = 'task-group';

      const heading = document.createElement('div');
      heading.className = 'task-group-head';
      const progress = HomeTasks.progressForChores(chores, state);
      heading.innerHTML = `
        <strong>${user.name}</strong>
        <span>${progress.done}/${progress.total} checks</span>
        <a href="/user.html?id=${user.id}">${user.name}'s page</a>
      `;
      group.appendChild(heading);

      if (!chores.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-note';
        empty.textContent = 'No active tasks';
        group.appendChild(empty);
      } else {
        group.appendChild(
          HomeTasks.renderTaskBoard(chores, state, loadChoreOverview)
        );
      }

      container.appendChild(group);
    }
  }

  document.getElementById('resetWeekBtn').addEventListener('click', async () => {
    if (!confirm('Clear all task checkmarks for this week?')) return;
    const users = await fetchUsers();
    HomeTasks.resetWeek();
    HomeTasks.clearLegacyKeys(users.map((u) => u.id));
    loadChoreOverview();
  });

  async function loadMeals() {
    const list = document.getElementById('mealsList');
    try {
      const res = await fetch('/api/meals');
      const meals = await res.json();
      list.innerHTML = '';
      if (!meals.length) {
        list.innerHTML = '<li class="empty-note">No meals planned yet.</li>';
        return;
      }
      meals.forEach(m => {
        const li = document.createElement('li');
        const type = m.type ? ` · ${m.type}` : '';
        li.innerHTML = `<strong>${m.day || 'Day'}:</strong> ${m.meal || ''}${type}`;
        list.appendChild(li);
      });
    } catch (err) {
      list.innerHTML = '<li class="empty-note">Could not load meals.</li>';
    }
  }

  async function loadEvents() {
    const list = document.getElementById('eventsList');
    try {
      const res = await fetch('/api/events');
      const events = await res.json();
      list.innerHTML = '';
      if (!events.length) {
        list.innerHTML = '<li class="empty-note">No upcoming events.</li>';
        return;
      }
      events.forEach(ev => {
        const li = document.createElement('li');
        const time = ev.time ? ` (${ev.time})` : '';
        const details = ev.details ? ` — ${ev.details}` : '';
        li.innerHTML = `<strong>${ev.date || 'TBD'}:</strong> ${ev.title || ''}${time}${details}`;
        list.appendChild(li);
      });
    } catch (err) {
      list.innerHTML = '<li class="empty-note">Could not load events.</li>';
    }
  }

  async function loadDailyQuote() {
    try {
      const response = await fetch('/api/quote');
      const data = await response.json();
      if (!Array.isArray(data) || !data[0]) {
        throw new Error('Unexpected quote response');
      }
      const quote = data[0];
      document.getElementById('quoteText').textContent = `\u201C${quote.q}\u201D`;
      document.getElementById('quoteAuthor').textContent = `\u2014 ${quote.a}`;
    } catch (error) {
      console.error('Error fetching the daily quote:', error);
      document.getElementById('quoteText').textContent = 'Stay positive and keep moving forward!';
      document.getElementById('quoteAuthor').textContent = '';
    }
  }

  HomeTasks.fillPeopleNav();
  HomeTasks.fillPersonButtons('personButtons');
  loadChoreOverview();
  loadMeals();
  loadEvents();
  loadDailyQuote();
</script>
</body>
</html>
